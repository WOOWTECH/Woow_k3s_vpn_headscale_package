# Instance values for the LOCAL k3s cluster (--context default), release
# "headscale-demo-services" in namespace tenant-local, alongside the
# "headscale-tenant" release. secrets.create=true is the deliberate choice
# here (this is a disposable demo DB, not a takeover of a real one) — the
# actual password is passed at install time with --set, never committed.
namespace:
  name: tenant-local

storageClassName: local-path

secrets:
  create: true

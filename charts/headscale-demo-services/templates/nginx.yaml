{{- if .Values.nginx.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-nginx
  namespace: {{ include "headscale-demo-services.ns" . }}
  labels:
    app: test-nginx
    {{- include "headscale-demo-services.partOf" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-nginx
  template:
    metadata:
      labels:
        app: test-nginx
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: test-nginx
  namespace: {{ include "headscale-demo-services.ns" . }}
  labels:
    app: test-nginx
    {{- include "headscale-demo-services.partOf" . | nindent 4 }}
spec:
  selector:
    app: test-nginx
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
{{- end }}

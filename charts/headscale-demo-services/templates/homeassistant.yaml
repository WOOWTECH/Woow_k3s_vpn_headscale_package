{{- if .Values.homeassistant.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config
  namespace: {{ include "headscale-demo-services.ns" . }}
  labels:
    app: homeassistant
    {{- include "headscale-demo-services.partOf" . | nindent 4 }}
  {{- include "headscale-demo-services.keepAnnotations" . | nindent 2 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.homeassistant.storage.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: {{ include "headscale-demo-services.ns" . }}
  labels:
    app: homeassistant
    {{- include "headscale-demo-services.partOf" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      containers:
        - name: homeassistant
          image: "{{ .Values.homeassistant.image.repository }}:{{ .Values.homeassistant.image.tag }}"
          ports:
            - containerPort: 8123
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            {{- toYaml .Values.homeassistant.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 8123
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: {{ include "headscale-demo-services.ns" . }}
  labels:
    app: homeassistant
    {{- include "headscale-demo-services.partOf" . | nindent 4 }}
spec:
  selector:
    app: homeassistant
  ports:
    - port: 8123
      targetPort: 8123
  type: ClusterIP
{{- end }}

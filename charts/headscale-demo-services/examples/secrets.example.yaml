# Create by hand before installing with secrets.create=false (the default):
#   kubectl create secret generic odoo-db-secret -n tenant-local \
#     --from-literal=POSTGRES_USER=odoo \
#     --from-literal=POSTGRES_PASSWORD='REPLACE_ME' \
#     --from-literal=POSTGRES_DB=postgres
apiVersion: v1
kind: Secret
metadata:
  name: odoo-db-secret
  namespace: tenant-local
type: Opaque
stringData:
  POSTGRES_USER: odoo
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: postgres

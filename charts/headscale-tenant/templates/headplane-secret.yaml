{{- /*
Headplane's session COOKIE_SECRET must survive `helm upgrade`, or every
upgrade invalidates every logged-in session. `lookup` reads the live Secret
(a no-op against `helm template`/`--dry-run`, which return an empty map) and
we reuse its value; only a first install (or a `helm template` render, which
has none to find) generates a fresh one.
*/ -}}
{{- if .Values.headplane.enabled }}
{{- $existing := lookup "v1" "Secret" (include "headscale-tenant.ns" .) "headplane-secrets" }}
{{- $cookie := "" }}
{{- if $existing }}
{{- $cookie = index $existing.data "COOKIE_SECRET" | b64dec }}
{{- else }}
{{- $cookie = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: headplane-secrets
  namespace: {{ include "headscale-tenant.ns" . }}
  labels:
    app: headplane
    {{- include "headscale-tenant.partOf" . | nindent 4 }}
  {{- include "headscale-tenant.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  COOKIE_SECRET: {{ $cookie | quote }}
{{- end }}

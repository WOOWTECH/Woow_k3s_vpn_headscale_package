{{- if .Values.headplane.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane-config
  namespace: {{ include "headscale-tenant.ns" . }}
  labels:
    app: headplane
    {{- include "headscale-tenant.partOf" . | nindent 4 }}
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 3000
      cookie_secret_path: "/etc/headplane/secrets/COOKIE_SECRET"
    headscale:
      url: "http://{{ include "headscale-tenant.headscaleSvc" . }}:8080"
      api_key_path: "/etc/headplane/api-key/api-key"
{{- end }}

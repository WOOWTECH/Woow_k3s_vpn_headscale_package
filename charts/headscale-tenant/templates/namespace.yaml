{{- /*
Namespace. One that equals the release namespace is skipped: Helm keeps its
release record there, so it is created with --create-namespace instead and
can never be deleted by `helm uninstall`.
*/ -}}
{{- if and .Values.namespace.create (ne (include "headscale-tenant.ns" .) .Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "headscale-tenant.ns" . }}
  labels:
    app.kubernetes.io/name: headscale-tenant
    {{- include "headscale-tenant.partOf" . | nindent 4 }}
  {{- include "headscale-tenant.keepAnnotations" . | nindent 2 }}
{{- end }}

apiVersion: v2
name: headscale-tenant
description: >-
  A per-tenant Headscale control plane (via the headscale-operator CRDs),
  Headplane web UI and userspace Tailscale proxies that publish in-cluster
  services onto the tailnet by DNS name. Requires the headscale-operator
  (WOOWTECH does not ship it; install chart 0.5.0 / app v0.6.0 from
  oci://ghcr.io/infradohq/headscale-operator/charts/headscale-operator first).
type: application
version: 1.1.0
appVersion: "0.29.2"
kubeVersion: ">=1.27.0-0"
keywords:
  - headscale
  - tailscale
  - vpn
  - headplane
home: https://github.com/WOOWTECH/Woow_k3s_vpn_headscale_package
sources:
  - https://github.com/WOOWTECH/Woow_k3s_vpn_headscale_package
  - https://github.com/WOOWTECH/Woow_podman_vpn_headscale_package
  - https://github.com/WOOWTECH/Woow_ha_vpn_headscale_package
  - https://github.com/infradohq/headscale-operator
  - https://github.com/juanfont/headscale
  - https://github.com/tale/headplane
maintainers:
  - name: WoowTech
    url: https://github.com/WOOWTECH

# Instance values for the LOCAL k3s cluster (--context default), release
# "headscale-tenant" in namespace tenant-local. No secrets in here — the
# headplane cookie is generated by the chart on first install and preserved
# by `lookup` on every upgrade after that.
namespace:
  name: tenant-local

storageClassName: local-path

headscale:
  serverUrl: "https://vpn-local.woowtech.io"
  baseDomain: "ts-local.woowtech.io"

headplane:
  ingress:
    enabled: false
